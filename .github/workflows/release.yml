name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16 (Swift 6 toolchain)
        run: |
          # FluidAudio 0.15.5 + Vendor/FluidAudioDeps require swift-tools 6.0.
          # The macos-14 image defaults to Xcode 15.4 (Swift 5.10); pick the
          # newest installed Xcode 16.x so `swift build` sees Swift 6.
          xcode=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "No Xcode 16.x found on runner:" >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version

      - name: Compute next version (conventional commits)
        id: ver
        run: |
          latest=$(git tag --list 'v*' | sort -V | tail -1)
          latest=${latest:-v0.2.0}
          base=${latest#v}
          major=$(echo "$base" | cut -d. -f1)
          minor=$(echo "$base" | cut -d. -f2)
          patch=$(echo "$base" | cut -d. -f3)

          if git rev-parse "$latest" >/dev/null 2>&1; then
            range="$latest..HEAD"
          else
            range="HEAD"
          fi
          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%B "$range")

          bump=patch
          if echo "$bodies" | grep -q "BREAKING CHANGE" || \
             echo "$subjects" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            bump=major
          elif echo "$subjects" | grep -qE '^feat(\([^)]+\))?:'; then
            bump=minor
          fi

          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump ($latest -> v$next)"

      - name: Install opus (linked statically by build.sh)
        run: brew install opus

      # FluidAudio object linking doesn't support universal builds yet
      # (build.sh rejects HYPERVIBE_UNIVERSAL=1), so releases are Apple
      # Silicon only for now — the macos-14 runner is arm64.
      - name: Build (arm64)
        run: ./build.sh

      - name: Bundle (ad-hoc signed on CI)
        run: ./create_app_bundle.sh

      - name: Package DMG
        run: ./make_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" "HyperVibe-$v.dmg" \
            --title "HyperVibe v$v" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes "Apple Silicon only (arm64). Not notarized: first launch requires right-click → Open, or \`xattr -d com.apple.quarantine /Applications/HyperVibe.app\`. Grant Accessibility + Input Monitoring in System Settings."
