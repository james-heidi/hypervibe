schema: spec-driven

context: |
  HyperVibe: macOS menu-bar app (Swift, AppKit) turning a Siri Remote into an
  input device for Claude Code; Siri button is push-to-talk speech-to-text.
  Build: ./build.sh (single swiftc invocation, no Xcode/SPM app build); new
  .swift files must be added to BOTH build.sh and Package.swift.
  STT today: FluidAudio 0.15.5 Parakeet TDT v3 (CoreML int8) or OpenAI cloud,
  one-shot decode after key release, then TranscriptPolisher pass.
  Read AGENTS.md for fragile invariants before proposing changes.
  No tests; verification is manual with a paired remote (/tmp/hypervibe.log).

